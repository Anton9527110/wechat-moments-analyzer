<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>微信面试法 · 朋友圈自动分析</title>
<style>
:root{--bg:#f4faf5;--panel:#ffffff;--panel2:#eef7f0;--border:#d5e8da;--text:#1f3d2a;--muted:#5f7a68;--accent:#2f9e6a;--accent2:#7bc96f;--ok:#1f9d6a;--danger:#d64550;--shadow:0 8px 24px rgba(47,120,80,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:
  radial-gradient(900px 420px at 8% -5%,rgba(123,201,111,.28),transparent 55%),
  radial-gradient(700px 380px at 100% 0%,rgba(168,220,180,.22),transparent 50%),
  linear-gradient(180deg,#f7fcf8 0%,var(--bg) 40%,#eef8f1 100%);
  color:var(--text);min-height:100vh}
header{padding:18px 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;color:#1b4d32}header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.wrap{max-width:980px;margin:0 auto;padding:16px 22px 48px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
h2{margin:0 0 10px;font-size:13px;color:var(--muted);letter-spacing:.02em}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,158,106,.25);border-color:#8ec9a3}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:720px){.row{grid-template-columns:1fr}}
.drop{border:1.5px dashed #9dcca8;border-radius:14px;padding:28px 16px;text-align:center;background:linear-gradient(180deg,#f8fdf9,#eef8f1);cursor:pointer;transition:.15s}
.drop.drag{border-color:var(--accent);background:#e7f7ec}
.drop strong{display:block;font-size:15px;margin-bottom:6px;color:#1f4d33}
.drop span{color:var(--muted);font-size:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{position:relative;width:110px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#fff;box-shadow:var(--shadow)}
.thumb img{width:110px;height:110px;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;border:0;background:rgba(31,61,42,.7);color:#fff;border-radius:8px;width:24px;height:24px;cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),#3bb87a);color:#fff;box-shadow:0 6px 14px rgba(47,158,106,.25)}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button.secondary{background:#fff;border:1px solid var(--border);color:var(--text);box-shadow:none}
.report{white-space:pre-wrap;line-height:1.55;font-size:13px;background:#f7fcf8;border:1px solid var(--border);border-radius:10px;padding:12px;min-height:220px;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.status{font-size:13px;color:var(--ok);margin-top:8px}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}

.insight{background:linear-gradient(180deg,#fbfffc,#f0f9f3);border:1px solid #cfe8d6;border-radius:16px;padding:14px 16px;box-shadow:0 8px 24px rgba(47,120,80,.08);white-space:pre-wrap;line-height:1.7;font-size:14px;color:#1f3d2a;min-height:80px}
.insight-empty{color:var(--muted);font-size:13px}

</style>
</head>
<body>
<header>
  <h1>🌿 微信面试法 · 朋友圈自动分析</h1>
  <p>上传微信主页/动态截图即可分析。模型按「外在表现 → 内在映射 → 正向/风险」对照规则表，不打分、不自动录用淘汰。</p>
</header>
<div class="wrap">
  <section class="card">
    <h2>上传截图</h2>
    <div class="drop" id="drop">
      <strong>点击或拖拽上传朋友圈图片</strong>
      <span>支持多张：头像/背景、签名区、动态列表、详情页均可</span>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div class="row">
      <div>
        <label>候选人称呼（可选）</label>
        <input id="name" placeholder="例如：國成 · Helu" />
      </div>
      <div>
        <label>评估场景（可选）</label>
        <select id="scene">
          <option value="">不指定</option>
          <option value="同路人">同路人</option>
          <option value="合伙人">合伙人</option>
          <option value="招聘候选人">招聘候选人</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button id="run" disabled>开始分析</button>
      <button class="secondary" id="clear">清空图片</button>
      <button class="secondary" id="copy" disabled>复制报告</button>
    </div>
    <div class="status" id="status" hidden></div>
    <div class="err" id="err" hidden></div>
  </section>

  <!-- 模型接口已内置，对用户隐藏 -->
  <div id="api-config" hidden>
    <input id="base" type="hidden" />
    <input id="model" type="hidden" />
    <input id="key" type="hidden" />
  </div>

<section class="card" id="insight-card">
    <h2>深度觉察 · 整体总结</h2>
    <div class="insight insight-empty" id="insight">上传图片并开始分析后，这里会先给出简版深度觉察（约 500 字内）。</div>
  </section>

  <section class="card">
    <h2>分析报告</h2>
    <div class="report" id="report">上传图片后点「开始分析」。</div>
  </section>
</div>

function getApiConfig(){
  // Prefer built-in defaults; only use localStorage if non-empty override exists
  const base = (localStorage.getItem('wxiv_base') || '').trim() || DEFAULT_BASE;
  const model = (localStorage.getItem('wxiv_model') || '').trim() || DEFAULT_MODEL;
  const key = (localStorage.getItem('wxiv_key') || '').trim() || DEFAULT_KEY;
  document.getElementById('base').value = base;
  document.getElementById('model').value = model;
  document.getElementById('key').value = key;
  return { base: base.replace(/\/$/, ''), model, key };
}

drop.onclick = () => fileInput.click();
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.onchange = () => addFiles(fileInput.files);

function addFiles(list){
  [...list].forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      files.push({ name: f.name, dataUrl: reader.result });
      renderThumbs();
    };
    reader.readAsDataURL(f);
  });
}

function renderThumbs(){
  thumbs.innerHTML = '';
  files.forEach((f, idx) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img alt=""/><button type="button" title="移除">×</button>`;
    d.querySelector('img').src = f.dataUrl;
    d.querySelector('button').onclick = (e) => { e.stopPropagation(); files.splice(idx,1); renderThumbs(); };
    thumbs.appendChild(d);
  });
  runBtn.disabled = files.length === 0;
}

document.getElementById('clear').onclick = () => { files.length = 0; renderThumbs(); const ig=document.getElementById('insight'); ig.className='insight insight-empty'; ig.textContent='上传图片并开始分析后，这里会先给出简版深度觉察（约 500 字内）。'; reportEl.textContent='上传图片后点「开始分析」。'; copyBtn.disabled=true; window.__lastFullText=''; };

  return `你是「微信面试法」朋友圈分析助手。严格依据给定规则表做定性分析。
判断模型：外在表现 → 内在映射（潜意识）→ 正向可能 / 风险可能。无权重分，无自动通过/淘汰。

分析模块顺序：1)长期能量状态（头像、背景、微信名+微信号、地区、签名）2)阶段能量状态（最近朋友圈、更新频率、文案）3)关系能量来源。

写一段「简版深度觉察整体总结」，要求：

5) 不要小标题编号，用 2～4 个自然段；不要列表；不要复述规则表原文。
口吻示例（仅学语气与留白，勿照抄内容）：

规则表 JSON（字段 m模块 y一级 t类型 x外在表现 i内在映射 p正向 r风险）：

}



function splitInsightAndReport(text){
  const raw = (text || '').trim();
  const m = raw.match(/===深度觉察===\s*([\s\S]*?)\s*===分析报告===\s*([\s\S]*)/);
  if (m) return { insight: m[1].trim(), report: m[2].trim() };
  const parts = raw.split(/\n{2,}/);
  if (parts.length >= 2 && raw.length > 200) {
    const insight = parts.slice(0, Math.min(3, parts.length-1)).join('\n\n').slice(0, 500);
    const report = parts.slice(Math.min(3, parts.length-1)).join('\n\n') || raw;
    return { insight, report };
  }
  return { insight: '', report: raw };
}

function renderInsight(text){
  const el = document.getElementById('insight');
  if (!text) {
    el.className = 'insight insight-empty';
    el.textContent = '本次未解析到深度觉察摘要，可查看下方完整报告。';
    return;
  }
  el.className = 'insight';
  el.textContent = text;
}

async function analyze(){
  errEl.hidden = true; statusEl.hidden = false; statusEl.textContent = '分析中…';
  const { base, model, key } = getApiConfig();
  if (!base || !model || !key) {
    statusEl.hidden = true; errEl.hidden = false;
    errEl.textContent = '内置接口配置异常，请刷新页面后重试，或把截图发给微信朋友圈分析 Bot。';
    return;
  }
  runBtn.disabled = true;
  const name = document.getElementById('name').value.trim();
  const scene = document.getElementById('scene').value;
  const userText = `请分析这些微信朋友圈/资料截图。候选人：${name || '未知'}。评估场景：${scene || '不指定'}。`;
  const content = [{ type: 'text', text: userText }];
  // limit images to avoid huge payloads; keep first 6
  const use = files.slice(0, 6);
  for (const f of use) {
    content.push({ type: 'image_url', image_url: { url: f.dataUrl } });
  }
  try {
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: 'system', content: systemPrompt() },
          { role: 'user', content }
        ],
        temperature: 0.2
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error((data.error && (data.error.message || JSON.stringify(data.error))) || ('HTTP '+resp.status));
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) throw new Error('接口未返回内容');
    const parts = splitInsightAndReport(text);
    renderInsight(parts.insight);
    reportEl.textContent = parts.report;
    window.__lastFullText = (parts.insight ? ('【深度觉察】\n' + parts.insight + '\n\n【分析报告】\n') : '') + parts.report;
    copyBtn.disabled = false;
    statusEl.textContent = '完成' + (files.length > 6 ? '（仅送入前 6 张图）' : '');
  } catch (e) {
    statusEl.hidden = true; errEl.hidden = false;
    errEl.textContent = '分析失败：' + (e.message || e);
  } finally {
    runBtn.disabled = files.length === 0;
  }
}

document.getElementById('run').onclick = analyze;
copyBtn.onclick = async () => {
  try { await navigator.clipboard.writeText(window.__lastFullText || reportEl.textContent); statusEl.hidden=false; statusEl.textContent='已复制'; }
  catch { prompt('复制报告', window.__lastFullText || reportEl.textContent); }
};
